<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>recipe-sync</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <h1>recipe-sync</h1>

    <section aria-labelledby="token-title">
      <h2 id="token-title">Instagram access</h2>
      <p id="token-status" class="hint"></p>
      <form id="token-form" autocomplete="off">
        <label for="token">Access token</label>
        <div class="row">
          <input id="token" type="password" spellcheck="false" placeholder="Paste the token from the Meta panel">
          <button type="submit">Save</button>
          <button type="button" id="token-clear" class="secondary">Remove</button>
        </div>
      </form>
      <p id="token-message" role="status"></p>
    </section>

    <section aria-labelledby="posts-title">
      <div class="head">
        <h2 id="posts-title">Recent posts</h2>
        <button type="button" id="posts-refresh" class="secondary">Refresh</button>
      </div>
      <p id="posts-message" role="status"></p>
      <ul id="posts" class="posts"></ul>
      <div id="caption-panel" hidden>
        <h3>Caption</h3>
        <pre id="caption"></pre>
      </div>
    </section>

    <section aria-labelledby="url-title">
      <h2 id="url-title">Check a URL</h2>
      <form id="source-form" autocomplete="off">
        <label for="url">Instagram URL</label>
        <div class="row">
          <input id="url" type="text" spellcheck="false" placeholder="https://www.instagram.com/reel/...">
          <button type="submit">Check</button>
        </div>
      </form>
      <p id="result" role="status"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
