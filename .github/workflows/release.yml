name: Release

# Pushing a tag such as v0.2.0 builds the Windows installer and attaches it to a draft release.
# Running the workflow by hand builds the installer and keeps it as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version in Cargo.toml" >&2
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installer
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: instapress-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" target/release/bundle/nsis/*.exe \
            --draft --title "Instapress ${GITHUB_REF_NAME}" --generate-notes
