name: Release

# Raising `version` in src-tauri/Cargo.toml on main releases it: the workflow creates the release
# `v<version>`, builds the Windows installer and the macOS dmg, attaches them and publishes the
# release. A version that already has a release is left alone. Run by hand (Actions tab, "Run
# workflow") it builds the version of the chosen branch again and replaces the attached files.
on:
  push:
    branches: [main]
    paths: [src-tauri/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Only the jobs that create, upload to or publish the release can write.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release unless the version is already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "Release $tag already exists: nothing to do."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Instapress $tag" --generate-notes
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  installers:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.1 --locked
      - name: Build the installer
        working-directory: src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundle }}
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ matrix.files }}
        # `$FILES` is left unquoted on purpose so the shell expands the pattern.
        run: gh release upload "$TAG" $FILES --clobber

  publish:
    needs: [prepare, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release once both installers are attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
