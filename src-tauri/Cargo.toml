[package]
name = "recipe-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Desktop app that turns an Instagram recipe post into a WordPress post"
authors = ["Enol Iglesias"]
license = "MIT"
default-run = "recipe-sync"

[lib]
name = "recipe_sync"
path = "src/lib.rs"

[[bin]]
name = "recipe-sync"
path = "src/gui/main.rs"

[dependencies]
ammonia = "4"
anyhow = "1"
base64 = { version = "0.22", default-features = false, features = ["std"] }
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
